<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本株財務指標スクリーナー</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="株スクリーナー" />
</head>
<body>
  <header>
    <h1>日本株財務指標スクリーナー</h1>
    <p id="updated-at">更新日時：読み込み中...</p>
  </header>

  <div id="search-bar">
    <input type="text" id="search-input" placeholder="会社名・証券コード" oninput="filterList()" />
  </div>
  <div id="sort-bar">
  <span>並び替え：</span>
  <button onclick="sortBy('market_cap')">時価総額</button>
  <button onclick="sortBy('sales')">売上高</button>
  <button onclick="sortBy('operating_profit')">営業利益</button>
  <button onclick="sortBy('equity')">純資産</button>
  <button onclick="sortBy('per')">PER</button>
  <button onclick="sortBy('roe')">ROE</button>
  <button onclick="sortBy('operating_margin')">営業利益率</button>
</div>
<main id="company-list">
    <p>データ読み込み中...</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
