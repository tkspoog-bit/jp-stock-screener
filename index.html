<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本株財務指標スクリーナー</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="株スクリーナー" />
</head>
<body>
  <div id="app">

    <!-- ヘッダー -->
    <header id="top-header">
      <h1>日本株スクリーナー</h1>
      <p id="updated-at">読み込み中...</p>
    </header>

    <!-- スクリーニング画面 -->
    <div id="screen-screen" class="screen active">
      <div class="screen-content">
        <h2>🔍 スクリーニング条件</h2>
        <div class="filter-section">
          <div class="filter-group">
            <label class="filter-label">市場</label>
            <div class="btn-group">
              <button onclick="setFilter('market', null, this)" class="active">全て</button>
              <button onclick="setFilter('market', 'プライム（内国株式）', this)">プライム</button>
              <button onclick="setFilter('market', 'スタンダード（内国株式）', this)">スタンダード</button>
              <button onclick="setFilter('market', 'グロース（内国株式）', this)">グロース</button>
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label">業種</label>
            <select id="industry-select" onchange="setIndustryFilter(this.value)">
              <option value="">全業種</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">PER（倍以下）</label>
          <select id="filter-per">
              <option value="">指定なし</option>
              <option value="5">5以下</option>
              <option value="10">10</option>
              <option value="15">15</option>
              <option value="20">20</option>
              <option value="25">25</option>
              <option value="30">30</option>
              <option value="40">40</option>
              <option value="50">50</option>
              <option value="100">100以上</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">ROE（%以上）</label>
            <select id="filter-roe">
              <option value="">指定なし</option>
              <option value="5">5以下</option>
              <option value="10">10</option>
              <option value="15">15</option>
              <option value="20">20</option>
              <option value="25">25</option>
              <option value="30">30以上</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">営業利益率（%以上）</label>
            <select id="filter-margin">
              <option value="">指定なし</option>
              <option value="5">5以下</option>
              <option value="10">10</option>
              <option value="15">15</option>
              <option value="20">20</option>
              <option value="25">25</option>
              <option value="30">30以上</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">時価総額（億円以下）</label>
            <select id="filter-cap">
              <option value="">指定なし</option>
              <option value="50">50以下</option>
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="300">300</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
              <option value="2000">2000</option>
              <option value="5000">5000以上</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">ネットキャッシュ比率（%以上）</label>
            <select id="filter-ncp">
              <option value="">指定なし</option>
              <option value="0">0以下</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="40">40</option>
              <option value="50">50以上</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">配当利回り（%以上）</label>
            <select id="filter-yield">
              <option value="">指定なし</option>
              <option value="1">1%以上</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6%以上</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">ネットネット倍率（倍以上）</label>
            <select id="filter-nn">
              <option value="">指定なし</option>
              <option value="0.3">0.3以下</option>
              <option value="0.5">0.5</option>
              <option value="0.7">0.7</option>
              <option value="1.0">1.0</option>
              <option value="1.5">1.5</option>
              <option value="2.0">2.0以上</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label">自己資本比率（%以上）</label>
            <select id="filter-equity-ratio">
              <option value="">指定なし</option>
              <option value="30">30%以上</option>
              <option value="40">40</option>
              <option value="50">50</option>
              <option value="60">60</option>
              <option value="70">70</option>
              <option value="80">80%以上</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">営業CF（黒字のみ）</label>
            <select id="filter-cf">
              <option value="">指定なし</option>
              <option value="1">黒字のみ</option>
            </select>
          </div>
          
        </div>
        <div class="screen-actions">
          <button class="btn-reset" onclick="clearScreenFilter()">リセット</button>
          <button class="btn-search" onclick="goToResults()">検索する</button>
        </div>
      </div>
    </div>

    <!-- ポートフォリオ画面 -->
    <div id="portfolio-screen" class="screen">
      <div class="screen-content">
        <h2>★ ポートフォリオ</h2>
        <div id="portfolio-list"></div>
        <button class="btn-add-pf" onclick="addPortfolio()">＋ ポートフォリオを追加</button>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen">
      <div id="result-toolbar">
        <input type="text" id="search-input" placeholder="会社名・証券コード" oninput="filterList()" />
        <div class="toolbar-right">
          <select id="sort-select" onchange="sortBy(this.value)">
            <option value="market_cap">時価総額</option>
            <option value="sales">売上高</option>
            <option value="operating_profit">営業利益</option>
            <option value="equity">純資産</option>
            <option value="per">PER</option>
            <option value="roe">ROE</option>
            <option value="operating_margin">営業利益率</option>
            <option value="net_cash_ratio">NC比率</option>
            <option value="net_net_ratio">ネットネット</option>
            <option value="dividend_yield">配当利回り</option>
          </select>
          <button onclick="exportCSV()">CSV</button>
        </div>
      </div>
      <div id="result-count"></div>
      <main id="company-list"></main>
    </div>

  </div>

    <!-- 設定画面 -->
    <div id="settings-screen" class="screen">
      <div class="screen-content">
        <h2>⚙️ 設定</h2>
        <div class="settings-section">
          <div class="settings-label">Gemini APIキー</div>
          <div class="settings-desc">
            AI詳細サマリの利用に必要です。<br>
            <a href="https://aistudio.google.com/app/apikey" target="_blank">① Google AI Studioで取得</a><br>
            ② 取得したキーを下の入力欄に貼り付けて「保存」<br>
            ③ 無料枠はモデルにより異なります（例：gemini-3.1-flash-liteはRPD500）<br>
            ⚠️ APIキーは外部に漏らさないよう注意してください。このアプリはキーをこのデバイスのみに保存します。
          </div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <input type="password" id="gemini-api-key" placeholder="APIキーを入力" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:0.9rem">
            <button onclick="saveApiKey()" style="padding:8px 16px;background:#1a1a2e;color:white;border:none;border-radius:8px;cursor:pointer">保存</button>
          </div>
          <div id="api-key-status" style="font-size:0.75rem;color:#888;margin-top:4px"></div>
        </div>
        <div class="settings-section">
          <div class="settings-label">AIモデル選択</div>
          <div class="settings-desc">精度と無料枠のバランスで選んでください</div>
          <select id="gemini-model" onchange="saveModel()" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:0.9rem;margin-top:8px">
            <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite（無料枠多い・推奨）</option>
            <option value="gemini-2.0-flash">gemini-2.0-flash（バランス型）</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash（高精度）</option>
          </select>
        </div>
        <div class="settings-section">
          <div class="settings-row">
            <div>
              <div class="settings-label">指標の説明を表示</div>
              <div class="settings-desc">各指標名をタップすると説明が表示されます</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="show-hints" onchange="saveSettings()" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        
      </div>
    </div>

  <!-- 詳細画面 -->
    <div id="detail-screen" class="screen">
      <div id="detail-back">
        <button onclick="closeDetail()">← 戻る</button>
      </div>
      <div id="detail-content"></div>
    </div>

    <!-- 用語画面 -->
    <div id="glossary-screen" class="screen">
      <div class="screen-content">
        <h2>📖 用語集</h2>
        <div id="glossary-list"></div>
      </div>
    </div>

  <!-- 下部タブ -->
  <nav id="bottom-nav">
    <button onclick="switchTab('screen')" class="nav-btn active" id="nav-screen">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">スクリーニング</span>
    </button>
    <button onclick="switchTab('portfolio')" class="nav-btn" id="nav-portfolio">
      <span class="nav-icon">★</span>
      <span class="nav-label">ポートフォリオ</span>
    </button>
    <button onclick="switchTab('result')" class="nav-btn" id="nav-result">
      <span class="nav-icon">📊</span>
      <span class="nav-label">結果</span>
    </button>
    <button onclick="switchTab('settings')" class="nav-btn" id="nav-settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">設定</span>
    </button>
    <button onclick="switchTab('glossary')" class="nav-btn" id="nav-glossary">
      <span class="nav-icon">📖</span>
      <span class="nav-label">用語</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
